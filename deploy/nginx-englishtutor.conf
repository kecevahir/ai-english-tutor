# Mount AI English Tutor under https://dmportal.com.tr/englishtutor
# Place beside the existing Express portal reverse-proxy / static site config.

upstream englishtutor_upstream {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  # Use inside the existing dmportal.com.tr server block, or include this file.

  location /englishtutor/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://englishtutor_upstream;
  }

  # Next.js may request /englishtutor without trailing slash
  location = /englishtutor {
    return 301 /englishtutor/;
  }
}
